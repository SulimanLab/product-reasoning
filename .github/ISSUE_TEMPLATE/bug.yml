name: Bug report
description: Report a reproducible problem with installation, invocation, validation, or skill behavior.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: Thanks for reporting a reproducible problem. Keep private data and secrets out of public issues.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the behavior you observed.
      placeholder: The skill was invoked, but...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should have happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include the prompt/task and only the context required to reproduce the issue.
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Agent/client
      placeholder: Claude Code, Codex, other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Skill version or commit
      placeholder: v1.0.0 or commit SHA
  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Logs, screenshots, or links that do not contain secrets or private project data.
